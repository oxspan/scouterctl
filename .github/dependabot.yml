version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci
  - package-ecosystem: gradle
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ['*']
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
