name: CI and release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      scale_validation:
        description: 'Measure offline comparison scale on Linux, Windows and macOS'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Existing release tag to repair missing assets (blank runs checks only)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.package.outputs.version }}
      sha: ${{ steps.package.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !env.ACT }}
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false
      - name: Copy local working tree
        if: ${{ env.ACT == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: ${{ env.ACT == 'true' }}
      - name: Build, test, and package
        run: ./gradlew --no-daemon test pocRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && !env.ACT }}
        with:
          name: test-results-ubuntu-latest
          path: build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Save local test results
        if: ${{ always() && env.ACT == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2; act artifact API
        with:
          name: test-results-ubuntu-latest
          path: build/test-results/test/*.xml
          if-no-files-found: warn
      - name: Verify package
        id: package
        env:
          EXPECTED_TAG: ${{ inputs.release_tag }}
        run: |
          bash .github/scripts/verify-package.sh
          printf 'version=%s\n' "$(cat version.txt)" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !env.ACT }}
        with:
          name: release-package
          path: |
            build/distributions/scouterctl-*-poc.zip
            build/distributions/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Save local package
        if: ${{ env.ACT == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2; act artifact API
        with:
          name: release-package
          path: |
            build/distributions/scouterctl-*-poc.zip
            build/distributions/SHA256SUMS
          if-no-files-found: error

  portable:
    name: Packaged CLI (${{ matrix.os }})
    needs: build
    if: inputs.release_tag == ''
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: build/portable-download
      - name: Verify and extract the release package
        id: package
        run: ./.github/scripts/verify-portable-package.ps1
      - name: Run Kotest against the extracted release JAR
        env:
          CLI_JAR: ${{ steps.package.outputs.cli_jar }}
        run: |
          if ($IsWindows) { ./gradlew.bat --no-daemon test "-PcliJar=$env:CLI_JAR" }
          else { ./gradlew --no-daemon test "-PcliJar=$env:CLI_JAR" }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 14

  scale:
    name: Optional capture scale validation
    if: github.event_name == 'workflow_dispatch' && inputs.scale_validation
    uses: ./.github/workflows/capture-scale.yml

  release:
    name: Manage release
    needs: [build, portable]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.portable.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: github.event_name == 'push'
        with:
          target-branch: master
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.release.outputs.release_created == 'true' || inputs.release_tag != ''
        with:
          name: release-package
          path: build/distributions
      - name: Attach verified package
        if: steps.release.outputs.release_created == 'true' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name || inputs.release_tag }}
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
          PACKAGE_SHA: ${{ needs.build.outputs.sha }}
        run: bash .github/scripts/upload-release.sh
