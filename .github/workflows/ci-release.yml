name: CI and release

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      scale_validation:
        description: 'Run optional offline scale validation'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Existing release tag to repair missing assets (blank runs checks only)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.package.outputs.version }}
      sha: ${{ steps.package.outputs.sha }}
      format: ${{ steps.package.outputs.format }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !env.ACT }}
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false
      - name: Copy local working tree
        if: ${{ env.ACT == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check pull request route
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          case "$BASE_BRANCH:$HEAD_BRANCH" in
            develop:feature/*|develop:hotfix/*|develop:master|develop:dependabot/*) ;;
            master:develop|master:hotfix/*|master:release-please--branches--master) ;;
            *) echo "Unsupported PR route: $HEAD_BRANCH -> $BASE_BRANCH" >&2; exit 1 ;;
          esac
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: ${{ env.ACT == 'true' }}
      - name: Build, test, and verify packages
        id: package
        env:
          EXPECTED_TAG: ${{ inputs.release_tag }}
        run: |
          coverage_args=()
          if [[ -z "${EXPECTED_TAG:-}" ]]; then
            coverage_args=(-Pcoverage=true coverageCheck)
          fi
          if [[ -f .github/scripts/verify-release-files.sh ]]; then
            ./gradlew --no-daemon test "${coverage_args[@]}" verifyReleaseInputs
            printf 'format=commands\n' >> "$GITHUB_OUTPUT"
            printf 'package_path=build/release-inputs\n' >> "$GITHUB_OUTPUT"
          else
            ./gradlew --no-daemon test pocRelease
            bash .github/scripts/verify-package.sh
            mkdir -p build/legacy-release
            cp build/distributions/scouterctl-*-poc.zip build/distributions/SHA256SUMS build/legacy-release/
            printf 'format=poc\n' >> "$GITHUB_OUTPUT"
            printf 'package_path=build/legacy-release\n' >> "$GITHUB_OUTPUT"
          fi
          version=$(cat version.txt)
          [[ -z "${EXPECTED_TAG:-}" || "$EXPECTED_TAG" == "v$version" ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Summarize tests and coverage
        if: ${{ always() && inputs.release_tag == '' }}
        run: |
          python3 .github/scripts/summarize-tests.py
          cat build/reports/ci/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload PR test summary
        if: ${{ always() && github.event_name == 'pull_request' && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-test-summary
          path: build/reports/ci/summary.md
          if-no-files-found: warn
          retention-days: 14
      - name: Upload coverage reports
        if: ${{ always() && !env.ACT && hashFiles('build/reports/jacoco/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: build/reports/jacoco/
          if-no-files-found: error
          retention-days: 14
      - name: Save local coverage reports
        if: ${{ always() && env.ACT == 'true' && hashFiles('build/reports/jacoco/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2; act artifact API
        with:
          name: coverage-reports
          path: build/reports/jacoco/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && !env.ACT }}
        with:
          name: test-results-ubuntu-latest
          path: build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Save local test results
        if: ${{ always() && env.ACT == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2; act artifact API
        with:
          name: test-results-ubuntu-latest
          path: build/test-results/test/*.xml
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !env.ACT }}
        with:
          name: release-package
          path: ${{ steps.package.outputs.package_path }}
          if-no-files-found: error
          retention-days: 14
      - name: Save local package
        if: ${{ env.ACT == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2; act artifact API
        with:
          name: release-package
          path: ${{ steps.package.outputs.package_path }}
          if-no-files-found: error

  test-comment:
    name: Comment test results
    needs: build
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download test summary
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-test-summary
          path: ci-summary
      - name: Create or update the PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- scouterctl-ci-test-summary -->';
            const {owner, repo} = context.repo;
            const issue_number = context.payload.pull_request.number;
            const head = context.payload.pull_request.head.sha;
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: issue_number});
            if (pr.state !== 'open' || pr.head.sha !== head) {
              core.info('Skipping results for an outdated or closed pull request.');
              return;
            }
            // Read report text only. Never check out or execute PR code with this token.
            const file = 'ci-summary/summary.md';
            const summary = fs.existsSync(file) && fs.statSync(file).size <= 16000
              ? fs.readFileSync(file, 'utf8')
              : 'Test and coverage summary unavailable. Check the workflow logs.';
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n**Linux CI: ${process.env.BUILD_RESULT}** · Commit \`${head.slice(0, 7)}\`\n\n${summary}\n[Workflow logs and report artifacts](${run})\n\n_Updated on each CI run. Windows checks, when required, are reported separately in the workflow._`;
            const comments = await github.paginate(github.rest.issues.listComments,
              {owner, repo, issue_number, per_page: 100});
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({owner, repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

  portable:
    name: Windows command package
    needs: build
    if: >-
      needs.build.outputs.format == 'commands' &&
      (github.event_name != 'pull_request' || github.base_ref == 'master')
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: build/release-inputs
      - name: Install pinned native toolchain
        id: zig
        run: ./.github/scripts/install-zig.ps1
      - name: Verify inputs and command release
        run: |
          ./gradlew.bat --no-daemon verifyReleaseInputs verifyCommandRelease "-PreleaseInputDirectory=build/release-inputs" "-PzigHome=${{ steps.zig.outputs.zig_home }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Kotest against the canonical JAR and native command
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $jar = (Resolve-Path "build/release-inputs/scouterctl-$env:PACKAGE_VERSION-all.jar").Path
          $archive = (Resolve-Path "build/release/scouterctl-$env:PACKAGE_VERSION-windows-x64.zip").Path
          ./gradlew.bat --no-daemon test "-PcliJar=$jar" "-PwindowsDistribution=$archive"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-commands
          path: build/release
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-windows-latest
          path: build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 14

  scale:
    name: Optional capture scale validation
    if: github.event_name == 'workflow_dispatch' && inputs.scale_validation
    uses: ./.github/workflows/capture-scale.yml

  release:
    name: Manage release
    needs: [build, portable]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.portable.result == 'success' ||
       (needs.build.outputs.format == 'poc' && github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: github.event_name == 'push'
        with:
          target-branch: master
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: (steps.release.outputs.release_created == 'true' || inputs.release_tag != '') && needs.build.outputs.format == 'commands'
        with:
          name: release-commands
          path: build/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.release_tag != '' && needs.build.outputs.format == 'poc'
        with:
          name: release-package
          path: build/distributions
      - name: Attach verified package
        if: steps.release.outputs.release_created == 'true' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name || inputs.release_tag }}
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
          PACKAGE_SHA: ${{ needs.build.outputs.sha }}
        run: bash .github/scripts/upload-release.sh
